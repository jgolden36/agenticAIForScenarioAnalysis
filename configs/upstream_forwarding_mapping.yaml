# =====================================================================
# Upstream-to-downstream feed-forward mapping (Algorithm 1, step 11)
# =====================================================================
#
# Declarative mapping from upstream model OUTPUT fields to downstream
# model INPUT parameters. Used by `src/pipeline/upstream_forwarding.py`
# to replace LLM-extracted shocks with values computed by upstream
# domain models. Override metadata is recorded on every replaced field
# so analysts can audit divergence between the LLM and the upstream
# models.
#
# Two level transitions are exercised today:
#   - COMMODITY  ->  COMMODITY_DOWNSTREAM
#       e.g. world_helium_model.effective_supply_gap_pct flows into
#       simrlfab.helium_supply_reduction_pct and
#       argonne_abm.supply_shock_pct so the semiconductor-fab and
#       helium-market-ABM simulations consume the helium model's
#       computed sectoral shortfall instead of an LLM estimate.
#   - COMMODITY (and COMMODITY_DOWNSTREAM)  ->  SHORT_RUN_MACRO /
#       LONG_RUN_MACRO_STRATEGIC
#       e.g. poles_jrc.peak_price_change_pct -> opencge.oil_price_shock_pct.
#
# Schema:
#   defaults:
#     llm_vs_upstream_warn_threshold_pct: <float>
#       Default deviation threshold (percent) above which a
#       ConsistencyFlag is emitted by `src/synthesis/consistency.py`.
#
#   models:
#     <downstream_model_id>:
#       <rule_name>:
#         sources:
#           - source_model: <upstream_model_id>
#             source_field: <output_key | dotted.path | nested[key]>
#             transform: identity | to_percent | level_to_pct | mean_of_keys
#             # transform-specific kwargs:
#             baseline: <number>          (level_to_pct only)
#             keys: [k1, k2, ...]         (mean_of_keys only)
#             value_kind: index | level | percent  (mean_of_keys only)
#         # Optional: target a single key inside a dict-valued
#         # downstream parameter (e.g. commodity_price_shocks.lng).
#         target_key: <key inside the param dict>
#         # Optional: explicit target_param when rule_name differs.
#         target_param: <name of the downstream param>
#         # Optional: restrict the rule to a subset of scenarios.
#         scenarios: [<scenario_id_1>, <scenario_id_2>, ...]
#
# Transforms:
#   identity        -- pass the source value through unchanged.
#   to_percent      -- multiply by 100 (e.g. 0.42 -> 42.0).
#   level_to_pct    -- (value / baseline - 1) * 100. Used when the
#                      upstream model emits a price LEVEL (USD/bbl,
#                      USD/MMBtu, USD/Mscf) rather than a pct change.
#   mean_of_keys    -- average over the named sub-keys of a dict-valued
#                      source field. With value_kind=index, each value
#                      is treated as a multiplier (1.4 -> +40%); with
#                      value_kind=percent, values are passed through;
#                      with value_kind=level, requires a `baseline`.
#   price_to_demand_reduction -- constant-elasticity bridge from a
#                      percent PRICE change to a percent demand
#                      REDUCTION. Required kwarg: `elasticity` (positive
#                      magnitude of the own-price elasticity of demand;
#                      typical value 0.35 for fertilizer). Optional
#                      `clip_max` caps the result (default 95.0). Output
#                      is zero for non-positive price shocks (i.e.
#                      falling prices do not raise demand above
#                      baseline in this bridge).
#
# Sources are tried in order; the first source whose run is COMPLETED,
# has a numeric value at source_field, and successfully transforms is
# used. If no source resolves, the LLM-extracted value is preserved
# (graceful degradation).
# =====================================================================

defaults:
  llm_vs_upstream_warn_threshold_pct: 50.0

models:

  # =====================================================================
  # COMMODITY_DOWNSTREAM tier: helium -> semiconductor / helium ABM
  # =====================================================================

  # ------------------------------------------------------------
  # SimRLFab (semiconductor fab simulator). Helium shortfalls are
  # forwarded from world_helium_model. Neon supply status and the
  # baseline fab utilisation rate stay LLM-extracted -- the helium
  # model has nothing to say about either, and the fab utilisation
  # is a calibration choice rather than a shock.
  # ------------------------------------------------------------
  simrlfab:
    helium_supply_reduction_pct:
      sources:
        # Effective supply gap is already a percent (0-100), and is
        # the most direct measure of how much of the fab's required
        # helium throughput will be unmet under the merge_into_params
        # rationing logic in world_helium_model.execute().
        - source_model: world_helium_model
          source_field: effective_supply_gap_pct
          transform: identity
        # Fall back to the price-side signal if the supply gap is
        # missing (older runs, or a real upstream model swap-in).
        - source_model: world_helium_model
          source_field: price_change_pct
          transform: identity
    disruption_duration_months:
      sources:
        - source_model: world_helium_model
          source_field: disruption_duration_months
          transform: identity
    # NOTE: neon_supply_status is categorical and not numeric; we leave
    # it on whatever the LLM extracted from the narrative. No mapping.
    # NOTE: fab_utilization_baseline is a calibration constant
    # describing the pre-disruption fab regime, not a shock; also
    # left LLM-extracted.

  # ------------------------------------------------------------
  # Argonne Helium ABM. Supply shock and disruption duration are
  # forwarded from world_helium_model. Demand-response elasticity is
  # a calibration parameter and stays LLM-extracted.
  # ------------------------------------------------------------
  argonne_abm:
    supply_shock_pct:
      sources:
        - source_model: world_helium_model
          source_field: effective_supply_gap_pct
          transform: identity
        - source_model: world_helium_model
          source_field: price_change_pct
          transform: identity
    disruption_duration_months:
      sources:
        - source_model: world_helium_model
          source_field: disruption_duration_months
          transform: identity
    # NOTE: demand_response_elasticity is a model calibration, not a
    # shock from the helium market -- left LLM-extracted.

  # ------------------------------------------------------------
  # APSIM (biophysical crop simulation). Sits at COMMODITY_DOWNSTREAM
  # so it consumes upstream FERTILIZER and WATER commodity outputs.
  #
  # The Mitscherlich N-response + FAO water-yield curves in apsim.py
  # collapse to zero yield loss when the LLM-extracted shock inputs
  # are zero -- which is what happened on 2026-05 runs where the
  # narrative did not state a fertilizer-application response. The
  # forwarding rules below bridge upstream price / supply signals
  # into APSIM's demand-side inputs so yield impacts reflect
  # commodity-model-computed shortages instead of LLM imputation.
  #
  #   fertilizer_application_reduction_pct
  #       <- world_fertilizer.fertilizer_price_index_pct
  #          via price_to_demand_reduction (own-price elasticity 0.35,
  #          Hendricks & Smith 2018 "Fertilizer Demand and Price";
  #          consistent with Yara 2024 grower-survey pass-through).
  #       <- futures.peak_price_index_per_commodity (mean of urea / dap
  #          / potash) as a fallback when world_fertilizer didn't run.
  #
  #   irrigation_water_reduction_pct
  #       <- cwatm.unmet_demand_pct (identity; CWatM reports a percent).
  #       <- weap_mena.aggregate_unmet_demand_pct (fallback).
  #       <- sahysmod.irrigation_water_reduction_pct (fallback; already
  #          a percent reduction).
  # ------------------------------------------------------------
  apsim:
    fertilizer_application_reduction_pct:
      sources:
        - source_model: world_fertilizer
          source_field: fertilizer_price_index_pct
          transform: price_to_demand_reduction
          elasticity: 0.35
        - source_model: futures
          source_field: peak_price_index_per_commodity
          transform: mean_of_keys
          keys: [urea, dap, potash]
          value_kind: index
    irrigation_water_reduction_pct:
      sources:
        - source_model: cwatm
          source_field: unmet_demand_pct
          transform: identity
        - source_model: weap_mena
          source_field: aggregate_unmet_demand_pct
          transform: identity
        - source_model: sahysmod
          source_field: irrigation_water_reduction_pct
          transform: identity
    # NOTE: growing_season is a categorical / textual hint that selects
    # the crop calendar and crop list; it's left LLM-extracted from the
    # narrative since no upstream commodity model emits one.

  # =====================================================================
  # COMMODITY tier: shipping outputs -> oil model rerouting parameters
  # =====================================================================
  #
  # AISDB and AIS_project (SHIPPING) compute rerouting costs and war-risk
  # insurance premia from closed-form Cape-of-Good-Hope detour math. The
  # OIL adapter POLES-JRC accepts these as friction parameters and
  # propagates them into the Brent price path. AIS_project is listed as
  # a fallback for the cost multiplier so analysts who only run one of
  # the two SHIPPING adapters still get the override.
  #
  # NOTE: aisdb / ais_project / poles_jrc all sit at AnalyticalLevel.
  # COMMODITY today, so they currently run in parallel. The forwarding
  # rules below take effect once SHIPPING outputs are available before
  # the OIL adapter consumes them -- typically when the executor's
  # within-level scheduling places SHIPPING earlier, or when the
  # adapter is reclassified to COMMODITY_DOWNSTREAM (a future YAML
  # tweak documented under "intra-tier dependencies" in CLAUDE.md).
  # ---------------------------------------------------------------------
  poles_jrc:
    rerouting_cost_multiplier:
      sources:
        - source_model: aisdb
          source_field: rerouting_cost_multiplier
          transform: identity
        - source_model: ais_project
          source_field: rerouting_cost_multiplier
          transform: identity
    insurance_premium_increase_pct:
      sources:
        - source_model: aisdb
          source_field: war_risk_insurance_premium_pct
          transform: identity

  # =====================================================================
  # MACRO tier: commodity outputs -> macro shocks
  # =====================================================================

  # ------------------------------------------------------------
  # OpenCGE (PSL OG-Core / OG-USA): aggregates oil + commodity
  # shocks via shock_to_productivity.
  # ------------------------------------------------------------
  opencge:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_usd
          transform: level_to_pct
          baseline: 80.0
    commodity_price_shocks:
      target_key: oil
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
    commodity_price_shocks__lng:
      target_param: commodity_price_shocks
      target_key: lng
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
        - source_model: energy_flux_lng_profits
          source_field: average_jkm_netback
          transform: level_to_pct
          baseline: 12.0
    commodity_price_shocks__helium:
      target_param: commodity_price_shocks
      target_key: helium
      sources:
        - source_model: world_helium_model
          source_field: price_change_pct
          transform: identity
    commodity_price_shocks__fertilizer:
      target_param: commodity_price_shocks
      target_key: fertilizer
      sources:
        # World Fertilizer Model (analytical MVP) emits a direct percent
        # index; preferred over the AR(1) decay path from `futures` when
        # both run, since it carries the natural-gas-feedstock and ME-
        # production-loss channels.
        - source_model: world_fertilizer
          source_field: fertilizer_price_index_pct
          transform: identity
        - source_model: futures
          source_field: peak_price_index_per_commodity
          transform: mean_of_keys
          keys: [urea, dap, potash]
          value_kind: index
    # Water enters the macro layer ONLY under the prescribed
    # infrastructure_collapse scenario, where the narrative and the
    # parameter extractor force supply_infrastructure_status to
    # severely_damaged/destroyed, so CWatM's unmet_demand_pct is
    # materially above zero.
    commodity_price_shocks__water:
      target_param: commodity_price_shocks
      target_key: water
      scenarios: [infrastructure_collapse]
      sources:
        - source_model: cwatm
          source_field: unmet_demand_pct
          transform: identity
        - source_model: weap_mena
          source_field: aggregate_unmet_demand_pct
          transform: identity
        - source_model: sahysmod
          source_field: irrigation_water_reduction_pct
          transform: identity

  # ------------------------------------------------------------
  # PyCGE (cge_modeling): same shape as OpenCGE.
  # ------------------------------------------------------------
  pycge:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_usd
          transform: level_to_pct
          baseline: 80.0
    commodity_price_shocks__lng:
      target_param: commodity_price_shocks
      target_key: lng
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
    commodity_price_shocks__helium:
      target_param: commodity_price_shocks
      target_key: helium
      sources:
        - source_model: world_helium_model
          source_field: price_change_pct
          transform: identity
    commodity_price_shocks__fertilizer:
      target_param: commodity_price_shocks
      target_key: fertilizer
      sources:
        - source_model: world_fertilizer
          source_field: fertilizer_price_index_pct
          transform: identity
        - source_model: futures
          source_field: peak_price_index_per_commodity
          transform: mean_of_keys
          keys: [urea, dap, potash]
          value_kind: index
    commodity_price_shocks__water:
      target_param: commodity_price_shocks
      target_key: water
      scenarios: [infrastructure_collapse]
      sources:
        - source_model: cwatm
          source_field: unmet_demand_pct
          transform: identity
        - source_model: weap_mena
          source_field: aggregate_unmet_demand_pct
          transform: identity
        - source_model: sahysmod
          source_field: irrigation_water_reduction_pct
          transform: identity

  # ------------------------------------------------------------
  # MPSGE.jl / GTAP: takes oil shock + a commodity_price_shocks dict.
  # ------------------------------------------------------------
  mpsge_jl:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
    commodity_price_shocks__lng:
      target_param: commodity_price_shocks
      target_key: lng
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
        - source_model: lngst
          source_field: ttf_price
          transform: level_to_pct
          baseline: 11.0
    commodity_price_shocks__helium:
      target_param: commodity_price_shocks
      target_key: helium
      sources:
        - source_model: world_helium_model
          source_field: price_change_pct
          transform: identity
    commodity_price_shocks__fertilizer:
      target_param: commodity_price_shocks
      target_key: fertilizer
      sources:
        - source_model: world_fertilizer
          source_field: fertilizer_price_index_pct
          transform: identity
        - source_model: futures
          source_field: peak_price_index_per_commodity
          transform: mean_of_keys
          keys: [urea, dap, potash]
          value_kind: index
    commodity_price_shocks__water:
      target_param: commodity_price_shocks
      target_key: water
      scenarios: [infrastructure_collapse]
      sources:
        - source_model: cwatm
          source_field: unmet_demand_pct
          transform: identity
        - source_model: weap_mena
          source_field: aggregate_unmet_demand_pct
          transform: identity
        - source_model: sahysmod
          source_field: irrigation_water_reduction_pct
          transform: identity
    # Trade-disruption spec (dict-valued downstream param). The aisdb
    # rerouting cost multiplier is forwarded to the
    # ``trade_cost_multiplier`` sub-key, which the MPSGE.jl analytical
    # fallback translates into a synthetic capex shock.
    trade_disruption_spec:
      target_key: trade_cost_multiplier
      sources:
        - source_model: aisdb
          source_field: rerouting_cost_multiplier
          transform: identity
        - source_model: ais_project
          source_field: rerouting_cost_multiplier
          transform: identity

  # ------------------------------------------------------------
  # MIRAGRODEP: oil shock (ffl sector) + fertilizer shock (crp sector).
  # ------------------------------------------------------------
  miragrodep:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
    fertilizer_price_shock_pct:
      sources:
        - source_model: futures
          source_field: peak_price_index_per_commodity
          transform: mean_of_keys
          keys: [urea, dap, potash]
          value_kind: index

  # ------------------------------------------------------------
  # NEMS (EIA): scedes-style per-fuel shocks. Each maps directly to a
  # NEMS module via src/models/macro/nems_shocks.DEFAULT_MAM_LINK_TABLE.
  # ------------------------------------------------------------
  nems:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
    natural_gas_price_shock_pct:
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
    lng_price_shock_pct:
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_jkm_netback
          transform: level_to_pct
          baseline: 12.0
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0

  # ------------------------------------------------------------
  # MAM (EIA Macroeconomic Activity Module): mirrors NEMS scedes
  # (eviews_subprocess mode only; aeo_ingestion mode ignores shocks).
  # ------------------------------------------------------------
  mam:
    oil_price_path:
      sources:
        - source_model: poles_jrc
          source_field: brent_price_path_usd_per_bbl
          transform: identity
    natural_gas_price_path:
      sources: []

  # ------------------------------------------------------------
  # Fed Workhorse Oil Model (Baumeister-Hamilton SVAR, analytical
  # MVP). Consumes the upstream-computed oil price impulse rather
  # than the LLM extraction so the IRF magnitudes line up with
  # POLES-JRC / BKR.
  # ------------------------------------------------------------
  fed_oil:
    oil_price_change_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity

  # ------------------------------------------------------------
  # MarketSim (BOEM partial-equilibrium consumer-surplus model,
  # analytical MVP). Consumes the upstream oil price impulse and
  # an LNG-derived gas price impulse so welfare estimates use the
  # same shock vector as the macro tier.
  # ------------------------------------------------------------
  marketsim:
    oil_price_shock_pct:
      sources:
        - source_model: poles_jrc
          source_field: peak_price_change_pct
          transform: identity
        - source_model: bornstein_krusell_rebelo
          source_field: oil_price_peak_pct_eps_u_no
          transform: identity
    natural_gas_price_change_pct:
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
        - source_model: lngst
          source_field: ttf_price
          transform: level_to_pct
          baseline: 11.0

  # ------------------------------------------------------------
  # NREL electricity-sector model (analytical MVP). Receives the
  # upstream gas-price impulse so retail-electricity / dispatch /
  # CO2 outputs are coherent with the LNG tier.
  # ------------------------------------------------------------
  nrel:
    natural_gas_price_change_pct:
      sources:
        - source_model: energy_flux_lng_profits
          source_field: average_ttf_netback
          transform: level_to_pct
          baseline: 10.0
        - source_model: lngst
          source_field: ttf_price
          transform: level_to_pct
          baseline: 11.0
