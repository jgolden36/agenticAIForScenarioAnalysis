# Analyst-authored deterministic baseline for the Hormuz 2026 case.
#
# This file replaces Module 1 (scenario generation) and Module 2 (parameter
# extraction) with fixed, analyst-written inputs so the rest of the pipeline
# (Module 3 execution with upstream forwarding, Module 4 consistency checks,
# a templated LLM-free synthesis) can be run with no language model at all.
# It is the comparator for the "what does the agentic layer add" experiment
# (Reviewer 2, point 1): the same adapters run on the same framework, the
# only difference being who wrote the scenario parameters.
#
# Structure
#   scenarios:   one entry per Scenario id (label, short narrative, the
#                quantitative assumptions the narrative commits to).
#   models:      one block per model id in src/parameters/model_specs.
#                `default` holds parameters shared by every scenario;
#                `by_scenario.<scenario_id>` overrides them. The runner
#                merges default <- by_scenario and injects `scenario_id`.
#   anchors:     documentation of the per-scenario anchor values the model
#                blocks were derived from. Not read by the runner.
#
# Every value is an analyst judgement anchored on the scenario framework
# (configs/scenario_frameworks/hormuz_2026.yaml), the crisis description, and
# the published figures cited inline. Where the LLM-driven run of
# 2026-05-04 recorded an applied shock (quantitative_results.csv,
# `_applied_shocks.*` and `_inputs.*` rows) the analyst value is stated next
# to it so the two can be compared. Categorical values use the vocabularies
# the adapters validate against.
#
# Run with:
#   python slurm/scripts/run_deterministic_baseline.py \
#       --baseline configs/baselines/hormuz_2026_analyst.yaml --run-id baseline_analyst

baseline_id: hormuz_2026_analyst
version: 1
authored: "2026-10"
description: >
  Analyst-authored scenario parameters for the five Hormuz 2026 scenarios
  (four Schwartz matrix quadrants plus the prescribed infrastructure-collapse
  tail risk). Values are fixed and documented so the pipeline can be rerun
  without a language model.

provenance:
  framework: configs/scenario_frameworks/hormuz_2026.yaml
  crisis_description: configs/crisis_descriptions/hormuz_2026.yaml
  llm_run_for_comparison: "20260504_222710"
  notes: >
    Oil transit through the Strait is about 20-21 mb/d (EIA, 2024), of which
    roughly 2.6 mb/d can bypass via the Saudi East-West pipeline and the UAE
    Habshan-Fujairah line (EIA, 2023), so the net loss is capped near 17-18 mb/d
    in the acute phase. Qatar exports about 77-80 Mt/yr of LNG (about 20 pct of
    global trade) and supplies about 30 pct of world helium (USGS, 2024). GCC
    desalination serves roughly 40 million people. Price anchors are analyst
    judgements consistent with Hamilton (2009) supply-shock elasticities and
    the 2022 European gas crisis as the LNG reference.

# Per-scenario anchors (documentation; the model blocks carry the values).
anchors:
  swift_contained:
    closure_weeks: 5
    acute_duration_months: 1.25
    net_oil_supply_loss_mbd: 14.0
    oil_price_shock_pct: 50.0
    henry_hub_change_pct: 15.0
    qatar_lng_export_loss_pct: 85.0
    helium_supply_loss_pct: 70.0
    desalination_capacity_loss_pct: 0.0
    fertilizer_price_shock_pct: 20.0
    llm_run_applied_oil_shock_pct: 54.79
  prolonged_contained:
    closure_weeks: 20
    acute_duration_months: 4.5
    net_oil_supply_loss_mbd: 15.0
    oil_price_shock_pct: 65.0
    henry_hub_change_pct: 25.0
    qatar_lng_export_loss_pct: 90.0
    helium_supply_loss_pct: 85.0
    desalination_capacity_loss_pct: 2.0
    fertilizer_price_shock_pct: 35.0
    llm_run_applied_oil_shock_pct: 60.5
  swift_escalated:
    closure_weeks: 6
    acute_duration_months: 1.5
    net_oil_supply_loss_mbd: 16.0
    oil_price_shock_pct: 60.0
    henry_hub_change_pct: 20.0
    qatar_lng_export_loss_pct: 90.0
    helium_supply_loss_pct: 85.0
    desalination_capacity_loss_pct: 15.0
    fertilizer_price_shock_pct: 30.0
    llm_run_applied_oil_shock_pct: 58.25
  prolonged_escalated:
    closure_weeks: 26
    acute_duration_months: 6.0
    net_oil_supply_loss_mbd: 17.0
    oil_price_shock_pct: 80.0
    henry_hub_change_pct: 35.0
    qatar_lng_export_loss_pct: 95.0
    helium_supply_loss_pct: 95.0
    desalination_capacity_loss_pct: 30.0
    fertilizer_price_shock_pct: 45.0
    llm_run_applied_oil_shock_pct: 51.82
  infrastructure_collapse:
    closure_weeks: 22
    acute_duration_months: 6.0
    infrastructure_recovery_months: 24.0
    net_oil_supply_loss_mbd: 13.5
    oil_price_shock_pct: 95.0
    henry_hub_change_pct: 45.0
    qatar_lng_export_loss_pct: 65.0
    helium_supply_loss_pct: 80.0
    desalination_capacity_loss_pct: 70.0
    fertilizer_price_shock_pct: 60.0
    llm_run_applied_oil_shock_pct: 48.36

scenarios:
  - scenario_id: swift_contained
    label: "Swift Resolution, Contained Conflict"
    narrative: >
      The Strait is mined and closed to commercial traffic in mid-February
      2026. A US-led naval escort regime and a brokered ceasefire restore
      transit after five weeks. The conflict stays on the Iran-US/Israel axis;
      no Gulf state infrastructure is struck. Net oil supply loss is about 14
      mb/d after pipeline bypass, Qatari LNG loading stops for the closure
      window, and helium shipments from Ras Laffan halt. Prices spike and
      retrace within a quarter; there is no lasting damage to productive
      capacity.
    quantitative_assumptions:
      closure_duration_weeks: 5
      net_oil_supply_loss_mbd: 14.0
      qatar_lng_export_loss_pct: 85
      helium_supply_loss_pct: 70
      desalination_capacity_loss_pct: 0
      oil_price_peak_change_pct: 50
    consistency_notes: "Short, sharp disruption; no infrastructure damage."
  - scenario_id: prolonged_contained
    label: "Prolonged Closure, Contained Conflict"
    narrative: >
      Iran keeps the Strait closed as a bargaining chip for about five months
      while hostilities stay limited to the Iran-US/Israel axis. Bypass
      pipelines run at capacity, strategic reserves are drawn down, and OPEC
      spare capacity outside the Gulf is used. Qatari LNG and helium exports
      stay offline for the full window. Markets price a structural shortfall,
      fertilizer feedstock costs rise with natural gas, and shipping reroutes
      around the Cape of Good Hope for the duration.
    quantitative_assumptions:
      closure_duration_weeks: 20
      net_oil_supply_loss_mbd: 15.0
      qatar_lng_export_loss_pct: 90
      helium_supply_loss_pct: 85
      desalination_capacity_loss_pct: 2
      oil_price_peak_change_pct: 65
    consistency_notes: "Prolonged shortfall without physical destruction."
  - scenario_id: swift_escalated
    label: "Swift Resolution, Escalated Conflict"
    narrative: >
      The Strait reopens after six weeks, but the conflict widens: strikes on
      Gulf coastal targets damage some desalination intakes and a loading
      terminal, Houthi attacks disrupt Bab el-Mandeb, and war-risk insurance
      spikes across the region. Oil and LNG flows resume quickly, yet repair
      work and the second chokepoint keep rerouting costs elevated. About
      fifteen percent of GCC desalination capacity is lost for several months.
    quantitative_assumptions:
      closure_duration_weeks: 6
      net_oil_supply_loss_mbd: 16.0
      qatar_lng_export_loss_pct: 90
      helium_supply_loss_pct: 85
      desalination_capacity_loss_pct: 15
      oil_price_peak_change_pct: 60
    consistency_notes: "Short closure, broad conflict, partial infrastructure damage."
  - scenario_id: prolonged_escalated
    label: "Prolonged Closure, Escalated Conflict"
    narrative: >
      A six-month closure combined with a regional war. Repeated strikes on
      Gulf energy and water infrastructure remove about thirty percent of
      desalination capacity, Qatari LNG trains are idled, helium supply from
      Qatar is effectively lost, and Bab el-Mandeb is contested. Net oil loss
      peaks near 17 mb/d. Humanitarian pressure in coastal GCC cities grows
      through the second quarter of the closure.
    quantitative_assumptions:
      closure_duration_weeks: 26
      net_oil_supply_loss_mbd: 17.0
      qatar_lng_export_loss_pct: 95
      helium_supply_loss_pct: 95
      desalination_capacity_loss_pct: 30
      oil_price_peak_change_pct: 80
    consistency_notes: "Prolonged closure with sustained infrastructure damage."
  - scenario_id: infrastructure_collapse
    label: "Infrastructure Collapse (Tail Risk)"
    narrative: >
      The prolonged-and-escalated path ends in the destruction of a large
      share of Gulf export and water infrastructure. The Strait formally
      reopens at month five, but throughput stays capped at 50-60 percent of
      pre-crisis volumes through year two. Seventy percent of GCC desalination
      capacity is lost with a two-year restoration, Ras Laffan runs at 30-40
      percent of nameplate for 18-24 months, and Saudi and UAE terminals lose
      5-8 mb/d of export capacity for 9-15 months. Reconstruction absorbs USD
      250-400 billion over three to five years.
    quantitative_assumptions:
      closure_duration_weeks: 22
      infrastructure_recovery_months: 24
      net_oil_supply_loss_mbd: 13.5
      qatar_lng_export_loss_pct: 65
      helium_supply_loss_pct: 80
      desalination_capacity_loss_pct: 70
      oil_price_peak_change_pct: 95
      reconstruction_overhang_bn_usd: 325
    consistency_notes: "supply_infrastructure_status = destroyed for the water adapters."

