# SimRLFab (SimPy + Tensorforce semiconductor fab simulator) configuration.
#
# Presence of this file activates the real SimRLFab subprocess driver
# (src/models/registry.py :: _build_simrlfab_adapter). Relative paths are
# resolved against the working directory (the repo root on the cluster)
# and made absolute, because the driver subprocess runs inside the
# SimRLFab tree.
#
# Prerequisite (one-time, on the cluster): a Python 3.6 environment with
# SimRLFab's pinned stack:
#
#   conda create -p ~/envs/simrlfab36 python=3.6 -y
#   ~/envs/simrlfab36/bin/pip install simpy==4.0 tensorforce==0.5.4 \
#       numpy==1.17 pandas==1.0.3 progressbar2==3.51.3
#
# The interpreter can also be given through HORMUZ_SIMRLFAB_PYTHON, which
# takes precedence over python_executable below.

simrlfab_repo_path: "Models/Helium Market_ Semiconductors/SimRLFab-master/SimRLFab-master"
python_executable: "~/envs/simrlfab36/bin/python"

# FIFO is a heuristic dispatcher: no RL training, fast. The driver still
# needs a Tensorforce agent config to pump the simulation; it defaults to
# <repo>/config/ppo1.json.
agent_type: "FIFO"
# agent_config_path: "Models/Helium Market_ Semiconductors/SimRLFab-master/SimRLFab-master/config/ppo1.json"

episodes: 50
timesteps_per_episode: 100
episodes_per_disruption_month: 10.0
timeout_seconds: 7200
