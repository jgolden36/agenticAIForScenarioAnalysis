# Default pipeline configuration

llm:
  provider: "anthropic"
  model: null  # Uses provider default
  temperature: 0.0

execution:
  max_parallel_models: 4
  default_timeout_seconds: 3600
  retry_failed_models: false
  capture_stderr: true

output:
  base_dir: "data"
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  reports_dir: "data/reports"

consistency:
  price_tolerance_pct: 20.0
  quantity_tolerance_pct: 15.0
  flag_on_missing_model: true

# Uncertainty quantification (Module 3 add-on).
# When enabled=true, the executor wraps each adapter's execute() in a
# perturbation loop unless the adapter populated ModelOutput.uncertainty
# itself (native UQ wins). Synthesis then receives per-output quantiles
# (p05/p25/p50/p75/p95) and the LLM emits a separate uncertainty
# interpretation paragraph per scenario.
uncertainty:
  enabled: false              # opt-in; flip to true to run UQ
  method: "perturbation"      # "perturbation" | "bootstrap" | "none"
  n_replicates: 20            # extra adapter runs per (scenario, model)
  perturbation_pct: 10.0      # +/- multiplicative noise on numeric inputs
  bootstrap_jitter_pct: 5.0   # noise floor for the 'bootstrap' method
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]
  seed: null                  # int for deterministic UQ runs
  max_failure_fraction: 0.5   # warn if more than this share of replicates raise

num_scenarios: 5  # 4 matrix quadrants (A-D) + 1 prescribed tail-risk (E: infrastructure_collapse)

# Observed-market calibration of the closed-form adapters
# (src/models/market_calibration.py). Off by default so runs reproduce the
# literature-calibrated results. When on, poles_jrc, lngst,
# energy_flux_lng_profits and world_fertilizer use pre-crisis (Nov 2025 -
# Jan 2026, median) World Bank Pink Sheet prices as baselines. Build the
# file with
#   python scripts/revision/fetch_market_data.py
#
# apply_half_lives is off: the AR(1) half-lives in calibration.json
# (8-29 months, 2000-2025) measure average persistence of deviations from
# a 3-year trend, not how fast a crisis spike decays. The observed 2026
# urea spike (+109% in April, +2.6% by October) decayed far faster than the
# 10.7-month estimate, consistent with the adapters' 3-5 month literature
# values, so those stay in use. Set true to use the estimates instead.
#
# Environment overrides: HORMUZ_MARKET_CALIBRATION=1|0,
# HORMUZ_MARKET_CALIBRATION_HALF_LIVES=1|0, HORMUZ_MARKET_CALIBRATION_FILE.
market_calibration:
  enabled: false
  apply_half_lives: false
  calibration_file: "data/market/calibration.json"
