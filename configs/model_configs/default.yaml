# Default pipeline configuration

llm:
  provider: "anthropic"
  model: null  # Uses provider default
  temperature: 0.0

execution:
  max_parallel_models: 4
  default_timeout_seconds: 3600
  retry_failed_models: false
  capture_stderr: true

output:
  base_dir: "data"
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  reports_dir: "data/reports"

consistency:
  price_tolerance_pct: 20.0
  quantity_tolerance_pct: 15.0
  flag_on_missing_model: true

# Uncertainty quantification (Module 3 add-on).
# When enabled=true, the executor wraps each adapter's execute() in a
# perturbation loop unless the adapter populated ModelOutput.uncertainty
# itself (native UQ wins). Synthesis then receives per-output quantiles
# (p05/p25/p50/p75/p95) and the LLM emits a separate uncertainty
# interpretation paragraph per scenario.
uncertainty:
  enabled: false              # opt-in; flip to true to run UQ
  method: "perturbation"      # "perturbation" | "bootstrap" | "none"
  n_replicates: 20            # extra adapter runs per (scenario, model)
  perturbation_pct: 10.0      # +/- multiplicative noise on numeric inputs
  bootstrap_jitter_pct: 5.0   # noise floor for the 'bootstrap' method
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]
  seed: null                  # int for deterministic UQ runs
  max_failure_fraction: 0.5   # warn if more than this share of replicates raise

num_scenarios: 5  # 4 matrix quadrants (A-D) + 1 prescribed tail-risk (E: infrastructure_collapse)
