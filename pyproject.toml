[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hormuz-pipeline"
version = "0.1.0"
description = "Agentic AI orchestration framework for multi-model crisis scenario analysis"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
adapters = [
    "openpyxl>=3.1",
    "pandas>=2.0",
]
julia = [
    "juliacall>=0.9.20",
]
gams = [
    "gamsapi[transfer]>=52.0",
]
excel = [
    "openpyxl>=3.1",
    "xlwings>=0.32",
]
r = [
    "rpy2>=3.5",
]
macro = [
    "ogcore>=0.13.0",
    "ogusa>=0.13.0",
    "dask[distributed]>=2024.1.0",
    "cge-modeling>=0.4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
]
water = [
    # Required for parsing CWatM and (future) WaterGAP2 NetCDF outputs.
    # netCDF4 is the minimum dependency; xarray is optional but useful for
    # downstream multi-dimensional array work.
    "netCDF4>=1.6",
    "xarray>=2024.1",
]
energy = [
    # OSeMOSYS data tooling (csv/excel <-> MathProg datafile <-> results).
    "otoole>=1.0",
    # IIASA MESSAGEix integrated assessment model and its scenario manager.
    # message-ix pulls in ixmp transitively, but pin both for clarity.
    "message-ix>=3.7",
    "ixmp>=3.7",
    # TEMOA energy-systems optimization framework (Pyomo-based).
    "temoa-energysystem>=0.1",
    "pyomo>=6.7",
    # Shared data-handling dependency used by all three adapters.
    "pandas>=2.0",
]
wandb = [
    # Optional Weights & Biases integration. The pipeline degrades to
    # a no-op when wandb is unavailable, so this extra is only needed
    # for users who want experiment tracking. See
    # src/common/wandb_logger.py for the contract.
    "wandb>=0.16",
]
news = [
    # News/data ingestion adapters used by the temporal weekly
    # re-analysis driver (slurm/jobs/weekly_news_pipeline.job and
    # slurm/scripts/build_weekly_brief.py). All four adapters
    # (NewsData.io, GNews, NewsAPI.org/.ai, EIA Open Data) talk plain
    # HTTPS, so `requests` is the only hard dependency.
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
